<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e24" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>

  <!-- A margem existe porque o macOS espera o ícone dentro de ~80% da tela. -->
  <rect x="100" y="100" width="824" height="824" rx="192" fill="url(#tile)" />
  <rect x="103" y="103" width="818" height="818" rx="189" fill="none" stroke="#3f3f46" stroke-width="6" />

  <!-- Barra de endereço: só o suficiente para o ícone dizer "navegador". -->
  <circle cx="252" cy="300" r="21" fill="#52525b" />
  <rect x="308" y="272" width="440" height="56" rx="28" fill="#27272a" />

  <!-- O W é o próprio "WWW" do nome. -->
  <path
    d="M 248 452 L 372 716 L 512 508 L 652 716 L 776 452"
    fill="none"
    stroke="url(#traco)"
    stroke-width="86"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
